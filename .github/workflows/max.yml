name: coral lineageos with resukisu susfs max

on:
  workflow_dispatch:
    inputs:
      base_img_url:
        description: "Direct download URL for LineageOS 23.2 base boot.img"
        required: true
        type: string
        default: "https://mirrorbits.lineageos.org/full/coral/20260911/boot.img"

jobs:
  build-resukisu-coral-4-14:
    runs-on: ubuntu-22.04

    steps:
      - name: Free runner space
        uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          swapfile-size: 30GiB

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libssl-dev libelf-dev \
            libncurses5-dev make zip git curl python3 bc cpio lz4 patch

      - name: Clone AOSP mkbootimg Tools
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools

      - name: Clone LineageOS 4.14 Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_google_msm-4.14 -b lineage-23.2 kernel_src

      - name: Apply ptrace_stop Backport Patch
        run: |
          cd kernel_src
          echo "=== Applying ptrace_stop backport patch ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            https://github.com/sidex15/android_kernel_lge_sm8150/commit/fcc59dc3310d3a1511d02dc3ac6d1e113517ece1.patch \
            | patch -p1

          # Verify no rejected hunks exist
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -ne 0 ]; then
            echo "::error::Found $REJ_COUNT rejected patch files in ptrace_stop patch!"
            find . -name "*.rej" -exec cat {} +
            exit 1
          fi
          echo "✅ ptrace_stop backport patch applied cleanly with 0 rejects."

      - name: Download Base boot.img
        run: |
          echo "=== Downloading base boot.img ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o base.img \
            "${{ inputs.base_img_url }}"
          ls -la base.img

      - name: Extract KERNELRELEASE from Base boot.img
        run: |
          echo "=== Extracting stock vermagic directly from base.img ==="
          mkdir -p base_unpacked
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img base.img --out base_unpacked
          lz4 -dc base_unpacked/kernel > /tmp/base_Image
          STOCK_RELEASE=$(strings /tmp/base_Image | grep -E "Linux version [0-9]" | head -n 1 | awk '{print $3}')
          echo "Extracted Stock KERNELRELEASE: $STOCK_RELEASE"
          test -n "$STOCK_RELEASE" || { echo "::error::Failed to extract vermagic from base.img"; exit 1; }
          echo "STOCK_RELEASE=$STOCK_RELEASE" >> $GITHUB_ENV

      - name: Setup Clang r416183b
        run: |
          mkdir -p clang
          echo "=== Downloading Clang r416183b ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r416183b.tar.gz"
          echo "=== Extracting Clang ==="
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang || { echo "::error::clang archive was invalid or empty"; exit 1; }
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          clang/bin/clang --version

      - name: Clone NonGKI SuSFS Patches
        run: |
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git nongki_build

      - name: Apply SuSFS Kernel Patches
        run: |
          cd kernel_src
          echo "=== Adapting and applying SuSFS 4.14 kernel patch ==="
          # 1. Adapt vfs_open signature in patch from 3 params to 2 params for 4.14 kernel
          sed 's/error = vfs_open(&path, file, current_cred());/error = vfs_open(\&path, file);/g' \
            ../nongki_build/Patches/Patch/susfs_patch_to_4.14.patch > /tmp/susfs_4.14_coral.patch

          # 2. Add missing context include in fs/proc/task_mmu.c
          sed -i '/#include <linux\/mm_inline.h>/a#include <linux\/ctype.h>' fs/proc/task_mmu.c

          # 3. Apply kernel patch
          patch -p1 < /tmp/susfs_4.14_coral.patch

          # 4. Verify no rejected hunks exist
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -ne 0 ]; then
            echo "::error::Found $REJ_COUNT rejected patch files!"
            find . -name "*.rej" -exec cat {} +
            exit 1
          fi
          echo "✅ SuSFS kernel patch applied cleanly with 0 rejects."

          # 5. Fix AOSP vold peer ID mount gap in all mounts and mountinfo functions
          python3 - << 'PY_EOF'
          with open("fs/proc_namespace.c", "r") as f:
              content = f.read()

          helper = """
          #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          static inline bool susfs_is_redundant_vold_obb(struct mount *r) {
          \tif (unlikely(r->mnt_mountpoint && !strcmp(r->mnt_mountpoint->d_name.name, "obb"))) {
          \t\tstruct mount *m_p = r->mnt_parent;
          \t\tint depth = 0;
          \t\twhile (m_p && m_p != m_p->mnt_parent && depth++ < 32) {
          \t\t\tif (m_p->mnt_mountpoint && !strcmp(m_p->mnt_mountpoint->d_name.name, "androidwritable"))
          \t\t\t\treturn true;
          \t\t\tm_p = m_p->mnt_parent;
          \t\t}
          \t}
          \treturn false;
          }
          #endif
          """

          # 1. Insert helper function above show_vfsmnt
          target_vfsmnt_def = "static int show_vfsmnt(struct seq_file *m, struct vfsmount *mnt)"
          if target_vfsmnt_def not in content:
              print("❌ Error: show_vfsmnt definition not found")
              exit(1)
          content = content.replace(target_vfsmnt_def, helper + "\n" + target_vfsmnt_def, 1)

          # 2. Inject check into show_vfsmnt (cold boot / hide_sus_mnts=0)
          target_vfsmnt_code = "if (sb->s_op->show_devname) {"
          replacement_vfsmnt_code = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (unlikely(!susfs_is_current_ksu_domain() && susfs_is_redundant_vold_obb(r)))
          \t\treturn 0;
          #endif
          \t""" + target_vfsmnt_code
          content = content.replace(target_vfsmnt_code, replacement_vfsmnt_code, 1)

          # 3. Inject check into show_mountinfo (cold boot / hide_sus_mnts=0)
          target_show_code = 'seq_printf(m, "%i %i %u:%u ", r->mnt_id, r->mnt_parent->mnt_id,'
          replacement_show_code = """#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT
          \tif (unlikely(!susfs_is_current_ksu_domain() && susfs_is_redundant_vold_obb(r)))
          \t\treturn 0;
          #endif
          \t""" + target_show_code
          content = content.replace(target_show_code, replacement_show_code, 1)

          # 4. Inject check into susfs_show_vfsmnt (when Brene / hide_sus_mnts=1)
          parts_vfsmnt = content.split("static int susfs_show_vfsmnt(struct seq_file *m, struct vfsmount *mnt)")
          if len(parts_vfsmnt) != 2:
              print("❌ Error: susfs_show_vfsmnt definition not found")
              exit(1)

          target_susfs = "if (r->mnt_id >= DEFAULT_KSU_MNT_ID)\n\t\treturn 0;"
          replacement_susfs = target_susfs + "\n\tif (unlikely(susfs_is_redundant_vold_obb(r)))\n\t\treturn 0;"

          if target_susfs not in parts_vfsmnt[1]:
              print("❌ Error: target not found inside susfs_show_vfsmnt")
              exit(1)
          parts_vfsmnt[1] = parts_vfsmnt[1].replace(target_susfs, replacement_susfs, 1)
          content = "static int susfs_show_vfsmnt(struct seq_file *m, struct vfsmount *mnt)".join(parts_vfsmnt)

          # 5. Inject check into susfs_show_mountinfo (when Brene / hide_sus_mnts=1)
          parts_mntinfo = content.split("static int susfs_show_mountinfo(struct seq_file *m, struct vfsmount *mnt)")
          if len(parts_mntinfo) != 2:
              print("❌ Error: susfs_show_mountinfo definition not found")
              exit(1)
          if target_susfs not in parts_mntinfo[1]:
              print("❌ Error: target not found inside susfs_show_mountinfo")
              exit(1)
          parts_mntinfo[1] = parts_mntinfo[1].replace(target_susfs, replacement_susfs, 1)
          content = "static int susfs_show_mountinfo(struct seq_file *m, struct vfsmount *mnt)".join(parts_mntinfo)

          with open("fs/proc_namespace.c", "w") as f:
              f.write(content)
          print("✅ Successfully patched all 4 mount/mountinfo functions in fs/proc_namespace.c")
          PY_EOF
          git diff fs/proc_namespace.c

      - name: Patch show_smap to Sanitize Executable File Mappings
        run: |
          cd kernel_src
          echo "=== Patching show_smap with optimized branch prediction ==="
          python3 - << 'PY_EOF'
          with open("fs/proc/task_mmu.c", "r") as f:
              content = f.read()

          target = """\tif (!rollup_mode || last_vma)
          \t\tseq_printf(m,
          \t\t\t   "Rss:            %8lu kB\\n"
          \t\t\t   "Pss:            %8lu kB\\n"
          \t\t\t   "Shared_Clean:   %8lu kB\\n"
          \t\t\t   "Shared_Dirty:   %8lu kB\\n"
          \t\t\t   "Private_Clean:  %8lu kB\\n"
          \t\t\t   "Private_Dirty:  %8lu kB\\n"
          \t\t\t   "Referenced:     %8lu kB\\n"
          \t\t\t   "Anonymous:      %8lu kB\\n"
          \t\t\t   "LazyFree:       %8lu kB\\n"
          \t\t\t   "AnonHugePages:  %8lu kB\\n"
          \t\t\t   "ShmemPmdMapped: %8lu kB\\n"
          \t\t\t   "Shared_Hugetlb: %8lu kB\\n"
          \t\t\t   "Private_Hugetlb: %7lu kB\\n"
          \t\t\t   "Swap:           %8lu kB\\n"
          \t\t\t   "SwapPss:        %8lu kB\\n"
          \t\t\t   "Locked:         %8lu kB\\n",
          \t\t\t   mss->resident >> 10,
          \t\t\t   (unsigned long)(mss->pss >> (10 + PSS_SHIFT)),
          \t\t\t   mss->shared_clean  >> 10,
          \t\t\t   mss->shared_dirty  >> 10,
          \t\t\t   mss->private_clean >> 10,
          \t\t\t   mss->private_dirty >> 10,
          \t\t\t   mss->referenced >> 10,
          \t\t\t   mss->anonymous >> 10,"""

          replacement = """\tif (!rollup_mode || last_vma) {
          \t\tunsigned long smap_priv_clean = mss->private_clean;
          \t\tunsigned long smap_priv_dirty = mss->private_dirty;
          \t\tunsigned long smap_anon = mss->anonymous;

          \t\tif (unlikely(!rollup_mode && vma->vm_file && (vma->vm_flags & VM_EXEC))) {
          \t\t\tif (smap_anon || smap_priv_dirty) {
          \t\t\t\tsmap_priv_clean += smap_priv_dirty;
          \t\t\t\tsmap_priv_dirty = 0;
          \t\t\t\tsmap_anon = 0;
          \t\t\t}
          \t\t}

          \t\tseq_printf(m,
          \t\t\t   "Rss:            %8lu kB\\n"
          \t\t\t   "Pss:            %8lu kB\\n"
          \t\t\t   "Shared_Clean:   %8lu kB\\n"
          \t\t\t   "Shared_Dirty:   %8lu kB\\n"
          \t\t\t   "Private_Clean:  %8lu kB\\n"
          \t\t\t   "Private_Dirty:  %8lu kB\\n"
          \t\t\t   "Referenced:     %8lu kB\\n"
          \t\t\t   "Anonymous:      %8lu kB\\n"
          \t\t\t   "LazyFree:       %8lu kB\\n"
          \t\t\t   "AnonHugePages:  %8lu kB\\n"
          \t\t\t   "ShmemPmdMapped: %8lu kB\\n"
          \t\t\t   "Shared_Hugetlb: %8lu kB\\n"
          \t\t\t   "Private_Hugetlb: %7lu kB\\n"
          \t\t\t   "Swap:           %8lu kB\\n"
          \t\t\t   "SwapPss:        %8lu kB\\n"
          \t\t\t   "Locked:         %8lu kB\\n",
          \t\t\t   mss->resident >> 10,
          \t\t\t   (unsigned long)(mss->pss >> (10 + PSS_SHIFT)),
          \t\t\t   mss->shared_clean  >> 10,
          \t\t\t   mss->shared_dirty  >> 10,
          \t\t\t   smap_priv_clean >> 10,
          \t\t\t   smap_priv_dirty >> 10,
          \t\t\t   mss->referenced >> 10,
          \t\t\t   smap_anon >> 10,"""

          if target not in content:
              print("❌ Error: Target seq_printf block not found in fs/proc/task_mmu.c")
              exit(1)

          content = content.replace(target, replacement, 1)

          close_target = "(unsigned long)(mss->pss_locked >> (10 + PSS_SHIFT)));"
          close_replacement = "(unsigned long)(mss->pss_locked >> (10 + PSS_SHIFT)));\n\t}"

          if close_target not in content:
              print("❌ Error: Close target not found in fs/proc/task_mmu.c")
              exit(1)

          content = content.replace(close_target, close_replacement, 1)

          with open("fs/proc/task_mmu.c", "w") as f:
              f.write(content)

          print("✅ Successfully patched show_smap in fs/proc/task_mmu.c")
          PY_EOF
          git diff fs/proc/task_mmu.c

      - name: Patch Binder to Sanitize LineageOS Services for Untrusted Apps
        run: |
          cd kernel_src
          echo "=== Patching drivers/android/binder.c with hardened structured parser ==="
          python3 - << 'PY_EOF'
          with open("drivers/android/binder.c", "r") as f:
              content = f.read()

          marker = """\t\tbinder_user_error("%d:%d got transaction with invalid data ptr\\n",
          \t\t\t\tproc->pid, thread->pid);
          \t\treturn_error = BR_FAILED_REPLY;
          \t\treturn_error_param = -EFAULT;
          \t\treturn_error_line = __LINE__;
          \t\tgoto err_copy_data_failed;
          \t}"""

          injection = """\n
          \t/* Fast-path: Sanitize LineageOS service queries strictly for untrusted apps (UID >= 10000) interacting with servicemanager */
          \tif (unlikely(tr->data_size >= 14 && context && context->binder_context_mgr_node)) {
          \t\tbool is_target_txn = false;

          \t\tif (reply) {
          \t\t\t/* Only inspect replies originating FROM servicemanager to untrusted apps */
          \t\t\tif (proc == context->binder_context_mgr_node->proc && target_proc && target_proc->tsk) {
          \t\t\t\trcu_read_lock();
          \t\t\t\tif (from_kuid(&init_user_ns, task_uid(target_proc->tsk)) >= 10000) {
          \t\t\t\t\tconst char *c = target_proc->tsk->comm;
          \t\t\t\t\tif (!strstr(c, "lineage") && !strstr(c, "android") && !strstr(c, "system") && !strstr(c, "trebuchet"))
          \t\t\t\t\t\tis_target_txn = true;
          \t\t\t\t}
          \t\t\t\trcu_read_unlock();
          \t\t\t}
          \t\t} else {
          \t\t\t/* Only inspect requests directed TO servicemanager from untrusted apps */
          \t\t\tif (target_node == context->binder_context_mgr_node && proc && proc->tsk) {
          \t\t\t\trcu_read_lock();
          \t\t\t\tif (from_kuid(&init_user_ns, task_uid(proc->tsk)) >= 10000) {
          \t\t\t\t\tconst char *c = proc->tsk->comm;
          \t\t\t\t\tif (!strstr(c, "lineage") && !strstr(c, "android") && !strstr(c, "system") && !strstr(c, "trebuchet"))
          \t\t\t\t\t\tis_target_txn = true;
          \t\t\t\t}
          \t\t\t\trcu_read_unlock();
          \t\t\t}
          \t\t}

          \t\tif (unlikely(is_target_txn)) {
          \t\t\t/* Hoisted constants for .rodata section and cache locality */
          \t\t\tstatic const u16 s_profile[] = { 'p', 'r', 'o', 'f', 'i', 'l', 'e' };
          \t\t\tstatic const u16 s_lineage[] = { 'l', 'i', 'n', 'e', 'a', 'g', 'e' };
          \t\t\tstatic const u16 s_vendor_lineage[] = { 'v', 'e', 'n', 'd', 'o', 'r', '.', 'l', 'i', 'n', 'e', 'a', 'g', 'e' };
          \t\t\tstatic const u16 s_dummy[] = { 'd', 'u', 'm', 'm', 'y', '_', '0' };

          \t\t\tif (!reply) {
          \t\t\t\t/* Fast-path request: ONLY sanitize "profile" queries (never touch lineage* hardware services) */
          \t\t\t\tu32 req_buf[64]; /* 256 bytes, guaranteed 4-byte aligned on kernel stack */
          \t\t\t\tsize_t copy_len = min_t(size_t, tr->data_size, sizeof(req_buf));

          \t\t\t\tif (copy_len >= 68) {
          \t\t\t\t\tstatic const u16 s_sm_token[26] = {
          \t\t\t\t\t\t'a', 'n', 'd', 'r', 'o', 'i', 'd', '.', 'o', 's', '.',
          \t\t\t\t\t\t'I', 'S', 'e', 'r', 'v', 'i', 'c', 'e', 'M', 'a', 'n', 'a', 'g', 'e', 'r'
          \t\t\t\t\t};
          \t\t\t\t\tu8 *kdata;
          \t\t\t\t\tsize_t offset;
          \t\t\t\t\tbool token_found = false;

          \t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, req_buf, t->buffer, 0, copy_len);
          \t\t\t\t\tkdata = (u8 *)req_buf;

          \t\t\t\t\t/* Scan for IServiceManager token across Android 9-16 Parcel header variants */
          \t\t\t\t\tfor (offset = 0; offset <= 24 && offset + 60 <= copy_len; offset += 4) {
          \t\t\t\t\t\tif (*(int32_t *)(kdata + offset) == 26 &&
          \t\t\t\t\t\t    !memcmp(kdata + offset + 4, s_sm_token, 52)) {
          \t\t\t\t\t\t\ttoken_found = true;
          \t\t\t\t\t\t\tbreak;
          \t\t\t\t\t\t}
          \t\t\t\t\t}

          \t\t\t\t\tif (!token_found)
          \t\t\t\t\t\tgoto skip_req_parse;

          \t\t\t\t\t/* Skip token length (4) + 52 bytes string + 4 bytes null/pad = 60 bytes total */
          \t\t\t\t\toffset += 60;

          \t\t\t\t\tif (offset + 4 <= copy_len) {
          \t\t\t\t\t\tint32_t name_len = *(int32_t *)(kdata + offset);
          \t\t\t\t\t\tif (name_len == 7 && offset + 4 + 14 <= copy_len) {
          \t\t\t\t\t\t\tu16 *name_chars = (u16 *)(kdata + offset + 4);
          \t\t\t\t\t\t\tif (name_chars[0] == 'p' && !memcmp(name_chars, s_profile, 14)) {
          \t\t\t\t\t\t\t\tint32_t i;
          \t\t\t\t\t\t\t\tfor (i = 0; i < 7; i++) {
          \t\t\t\t\t\t\t\t\tname_chars[i] = s_dummy[i];
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\tbinder_alloc_copy_to_buffer(&target_proc->alloc, t->buffer, offset + 4, name_chars, 14);
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\tskip_req_parse: ;
          \t\t\t} else {
          \t\t\t\t/* Full-scan reply: listServices without truncation */
          \t\t\t\tif (tr->data_size >= 8) {
          \t\t\t\t\tint32_t header[2]; /* [0] = exc, [1] = count */
          \t\t\t\t\tint32_t exc;
          \t\t\t\t\tint32_t count;

          \t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, header, t->buffer, 0, sizeof(header));
          \t\t\t\t\texc = header[0];
          \t\t\t\t\tcount = header[1];

          \t\t\t\t\t/* Validate standard AIDL reply format */
          \t\t\t\t\tif (exc == 0 && count > 0 && count <= 2000) {
          \t\t\t\t\t\tsize_t offset = 8;
          \t\t\t\t\t\tint32_t c;

          \t\t\t\t\t\tfor (c = 0; c < count && offset + 4 <= tr->data_size; c++) {
          \t\t\t\t\t\t\tint32_t len = 0;
          \t\t\t\t\t\t\tsize_t str_bytes;

          \t\t\t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, &len, t->buffer, offset, sizeof(len));

          \t\t\t\t\t\t\tif (len < 0 || len > 256) {
          \t\t\t\t\t\t\t\tif (len < 0) offset += 4; /* Binder represents null strings as -1 */
          \t\t\t\t\t\t\t\telse break; /* Malformed or non-string parcel: safely stop */
          \t\t\t\t\t\t\t\tcontinue;
          \t\t\t\t\t\t}

          \t\t\t\t\t\t\t/* Calculate exact string block size including null terminator and 4-byte alignment padding */
          \t\t\t\t\t\t\tstr_bytes = ((len + 1) * 2 + 3) & ~3;
          \t\t\t\t\t\t\tif (offset + 4 + str_bytes > tr->data_size) break;

          \t\t\t\t\t\t\tif (len >= 7 && len <= 128) {
          \t\t\t\t\t\t\t\tu16 chars[128];
          \t\t\t\t\t\t\t\tu16 first_char;

          \t\t\t\t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, chars, t->buffer, offset + 4, len * 2);
          \t\t\t\t\t\t\t\tfirst_char = chars[0];

          \t\t\t\t\t\t\t\t/* FAST-PATH REJECT */
          \t\t\t\t\t\t\t\tif (first_char == 'p' || first_char == 'l' || first_char == 'v') {
          \t\t\t\t\t\t\t\t\tbool match = false;
          \t\t\t\t\t\t\t\t\tif (len == 7 && !memcmp(chars, s_profile, 14)) match = true;
          \t\t\t\t\t\t\t\t\telse if (len >= 7 && !memcmp(chars, s_lineage, 14)) match = true;
          \t\t\t\t\t\t\t\t\telse if (len >= 14 && !memcmp(chars, s_vendor_lineage, 28)) match = true;

          \t\t\t\t\t\t\t\tif (match) {
          \t\t\t\t\t\t\t\t\tint32_t i;
          \t\t\t\t\t\t\t\t\tfor (i = 0; i < len; i++) {
          \t\t\t\t\t\t\t\t\t\tchars[i] = (i < 7) ? s_dummy[i] : '0';
          \t\t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\t\t/* 4.14 SAFE: Write ONLY the modified string back */
          \t\t\t\t\t\t\t\t\tbinder_alloc_copy_to_buffer(&target_proc->alloc, t->buffer, offset + 4, chars, len * 2);
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t}

          \t\t\t\t\t\toffset += 4 + str_bytes;
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t}
          }"""

          if marker not in content:
              print("❌ Error: Target marker block not found in drivers/android/binder.c")
              exit(1)

          content = content.replace(marker, marker + injection, 1)

          with open("drivers/android/binder.c", "w") as f:
              f.write(content)

          print("✅ Successfully patched drivers/android/binder.c with hardened structured parser")
          PY_EOF
          git diff drivers/android/binder.c

      - name: Setup ReSukiSU Driver
        run: |
          cd kernel_src
          echo "=== Adding ReSukiSU (Main Branch for v4.2.0-rc1) ==="
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git
          
          # Symlink the kernel driver
          cd drivers
          ln -sf ../ReSukiSU/kernel kernelsu
          cd ..
          
          # Register in Makefile and Kconfig
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

      - name: Apply SuSFS Inline Hooks
        run: |
          cd kernel_src
          echo "=== Applying SuSFS inline hooks ==="
          # Must run after drivers/kernelsu is symlinked so ksu_handle_setresuid is hooked
          bash ../nongki_build/Patches/susfs_inline_hook_patches.sh
          echo "✅ SuSFS inline hooks applied."

      - name: Bypass Vendor Module CRC Check (Fix Vendor Module Loading)
        run: |
          cd kernel_src
          echo "=== Allowing vendor modules to load despite compiler CRC difference ==="
          sed -i '/bad_version:/,/return 0;/s/return 0;/return 1;/' kernel/module.c

      - name: Fix Driver Include Paths
        run: |
          cd kernel_src
          echo "=== Fixing driver include syntax for standalone Clang compilation ==="
          # 1. Camera Floral Tracepoint Path
          sed -i "1i ccflags-y += -I\$(src)" drivers/media/platform/msm/camera_floral/cam_utils/Makefile

          # 2. Battery driver angled includes -> quoted includes
          sed -i 's/<google\/google_bms.h>/"google\/google_bms.h"/' drivers/power/supply/max1720x_battery.c
          sed -i 's/<google\/logbuffer.h>/"google\/logbuffer.h"/' drivers/power/supply/max1720x_battery.c

          # 3. IPA v3 driver missing parent include directory
          sed -i "1i ccflags-y += -I\$(srctree)/drivers/platform/msm/ipa/ipa_v3" drivers/platform/msm/ipa/ipa_v3/Makefile

          # 4. Fix relative angled includes (<../...>) across all drivers safely
          grep -rlE '#include <\.\./' drivers/ | xargs -r sed -i -E 's|#include <(\.\./[^>]+)>|#include "\1"|g'

      - name: Configure ReSukiSU + SuSFS Kernel
        run: |
          cd kernel_src
          echo "=== Generating base .config from floral_defconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            floral_defconfig

          echo "=== Setting ReSukiSU + SuSFS kernel options via scripts/config ==="
          ./scripts/config --file .config -e KSU
          ./scripts/config --file .config -d KSU_WITH_KPROBES
          ./scripts/config --file .config -d KSU_MANUAL_HOOK

          # SuSFS configuration
          ./scripts/config --file .config -e KSU_SUSFS
          ./scripts/config --file .config -e KSU_SUSFS_SUS_PATH
          ./scripts/config --file .config -e KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file .config -e KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file .config -e KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file .config -e KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file .config -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file .config -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          ./scripts/config --file .config -e KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file .config -e KSU_SUSFS_SUS_MAP

          ./scripts/config --file .config -d CC_WERROR
          ./scripts/config --file .config -e OVERLAY_FS
          ./scripts/config --file .config -e TMPFS_XATTR
          ./scripts/config --file .config -e KALLSYMS
          ./scripts/config --file .config -e KALLSYMS_ALL

          # Enforce exact stock vermagic
          echo "${{ env.STOCK_RELEASE }}" > .scmversion
          mkdir -p include/config
          echo "${{ env.STOCK_RELEASE }}" > include/config/kernel.release

          echo "=== Updating and verifying .config with olddefconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          echo "=== Verifying SuSFS config in final .config ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_TMPFS_XATTR" .config

      - name: Build ReSukiSU + SuSFS Kernel Binary (Image.lz4)
        run: |
          cd kernel_src
          echo "=== Compiling ReSukiSU + SuSFS Image.lz4 with pure LLVM ==="
          make -j"$(nproc)" ARCH=arm64 \
            CC=clang HOSTCC=clang HOSTCXX=clang++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KERNELRELEASE="${{ env.STOCK_RELEASE }}" \
            Image.lz4

          echo "=== Verifying KernelSU and SuSFS strings in compiled vmlinux ==="
          if strings vmlinux | grep -i -q "kernelsu"; then
            echo "✅ ReSukiSU symbols/strings found in vmlinux!"
          else
            echo "❌ ERROR: No KernelSU strings found in the compiled binary!"
            exit 1
          fi

          if strings vmlinux | grep -i -q "susfs"; then
            echo "✅ SuSFS symbols/strings found in vmlinux!"
          else
            echo "❌ ERROR: No SuSFS strings found in the compiled binary!"
            exit 1
          fi

      - name: Repack ReSukiSU + SuSFS boot.img
        run: |
          set -e
          mkdir -p out_artifacts unpacked
          
          IMAGE_LZ4=$(find kernel_src/arch/arm64/boot -name "Image.lz4" | head -n 1)
          test -f "$IMAGE_LZ4" || { echo "::error::Image.lz4 not found!"; exit 1; }
          cp "$IMAGE_LZ4" out_artifacts/Image.lz4

          echo "=== Unpacking original boot.img ==="
          ARGS=$(python3 mkbootimg_tools/unpack_bootimg.py \
            --boot_img base.img \
            --out unpacked \
            --format mkbootimg)

          echo "=== Substituting newly compiled kernel ==="
          NEW_ARGS=$(echo "$ARGS" | sed -E "s#--kernel [^ ]+#--kernel out_artifacts/Image.lz4#")

          echo "=== Repacking boot.img ==="
          eval "python3 mkbootimg_tools/mkbootimg.py $NEW_ARGS --output out_artifacts/boot.img"

          test -f out_artifacts/boot.img || { echo "::error::Failed to create repacked boot.img"; exit 1; }
          echo "Successfully created ReSukiSU + SuSFS boot.img"

      - name: Upload ReSukiSU + SuSFS boot.img Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coral-resukisu-susfs
          path: out_artifacts/*
          if-no-files-found: error

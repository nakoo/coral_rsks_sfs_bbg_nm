name: coral lineageos with resukisu susfs

on:
  workflow_dispatch:
    inputs:
      base_img_url:
        description: "Custom boot.img URL (leave empty to use default)"
        required: false
        type: string

env:
  DEFAULT_BASE_IMG_URL: "https://mirrorbits.lineageos.org/full/coral/20260911/boot.img"

jobs:
  build-resukisu-coral-4-14:
    runs-on: ubuntu-22.04

    steps:
      - name: Free runner space
        uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          swapfile-size: 30GiB

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libssl-dev libelf-dev \
            libncurses5-dev make zip git curl python3 bc cpio lz4 patch

      - name: Clone AOSP mkbootimg Tools
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools

      - name: Clone LineageOS 4.14 Kernel Source
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_google_msm-4.14 -b lineage-23.2 kernel_src

      - name: Apply ptrace_stop Backport Patch
        run: |
          cd kernel_src
          echo "=== Applying ptrace_stop backport patch ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            https://github.com/sidex15/android_kernel_lge_sm8150/commit/fcc59dc3310d3a1511d02dc3ac6d1e113517ece1.patch \
            | patch -p1

          # Verify no rejected hunks exist
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -ne 0 ]; then
            echo "::error::Found $REJ_COUNT rejected patch files in ptrace_stop patch!"
            find . -name "*.rej" -exec cat {} +
            exit 1
          fi
          echo "✅ ptrace_stop backport patch applied cleanly with 0 rejects."

      - name: Download Base boot.img
        run: |
          TARGET_URL="${{ inputs.base_img_url || env.DEFAULT_BASE_IMG_URL }}"
          echo "=== Downloading base boot.img from: $TARGET_URL ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o base.img \
            "$TARGET_URL"
          ls -la base.img

      - name: Extract KERNELRELEASE and mkbootimg args from Base boot.img
        run: |
          echo "=== Extracting stock vermagic directly from base.img ==="
          mkdir -p unpacked out_artifacts
          python3 mkbootimg_tools/unpack_bootimg.py \
            --boot_img base.img \
            --out unpacked \
            --format mkbootimg > mkbootimg_args
          lz4 -dc unpacked/kernel > /tmp/base_Image
          STOCK_RELEASE=$(strings /tmp/base_Image | grep -E "Linux version [0-9]" | head -n 1 | awk '{print $3}')
          echo "Extracted Stock KERNELRELEASE: $STOCK_RELEASE"
          test -n "$STOCK_RELEASE" || { echo "::error::Failed to extract vermagic from base.img"; exit 1; }
          echo "STOCK_RELEASE=$STOCK_RELEASE" >> $GITHUB_ENV

      - name: Setup Clang r416183b
        run: |
          mkdir -p clang
          echo "=== Downloading Clang r416183b ==="
          curl -fSL \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r416183b.tar.gz"
          echo "=== Extracting Clang ==="
          tar -xzf clang.tar.gz -C clang
          test -x clang/bin/clang || { echo "::error::clang archive was invalid or empty"; exit 1; }
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          clang/bin/clang --version

      - name: Clone NonGKI SuSFS Patches
        run: |
          git clone --depth=1 https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd.git nongki_build

      - name: Apply SuSFS Kernel Patches
        run: |
          cd kernel_src
          echo "=== Adapting and applying SuSFS 4.14 kernel patch ==="
          # 1. Adapt vfs_open signature in patch from 3 params to 2 params for 4.14 kernel
          sed 's/error = vfs_open(&path, file, current_cred());/error = vfs_open(\&path, file);/g' \
            ../nongki_build/Patches/Patch/susfs_patch_to_4.14.patch > /tmp/susfs_4.14_coral.patch

          # 2. Add missing context include in fs/proc/task_mmu.c
          sed -i '/#include <linux\/mm_inline.h>/a#include <linux\/ctype.h>' fs/proc/task_mmu.c

          # 3. Apply kernel patch
          patch -p1 < /tmp/susfs_4.14_coral.patch

          # 4. Verify no rejected hunks exist
          REJ_COUNT=$(find . -name "*.rej" | wc -l)
          if [ "$REJ_COUNT" -ne 0 ]; then
            echo "::error::Found $REJ_COUNT rejected patch files!"
            find . -name "*.rej" -exec cat {} +
            exit 1
          fi
          echo "✅ SuSFS kernel patch applied cleanly with 0 rejects."

      - name: Patch show_smap to Sanitize Executable File Mappings
        run: |
          cd kernel_src
          echo "=== Patching show_smap with synchronized smaps and smaps_rollup accounting ==="
          python3 - << 'PY_EOF'
          with open("fs/proc/task_mmu.c", "r") as f:
              content = f.read()

          # Ensure linux/cred.h is present for task_uid macro
          if "#include <linux/cred.h>" not in content:
              content = content.replace("#include <linux/ctype.h>", "#include <linux/ctype.h>\n#include <linux/cred.h>", 1)

          target = "\twalk_page_vma(vma, &smaps_walk);"

          replacement = """\t{
          \t\tunsigned long vma_before_dirty = mss->private_dirty;
          \t\tunsigned long vma_before_anon = mss->anonymous;
          \t\tunsigned long vma_before_swap = mss->swap;

          \t\t/* mmap_sem is held in m_start */
          \t\twalk_page_vma(vma, &smaps_walk);

          \t\t/* Only sanitize for untrusted non-system target processes inspecting executable VMAs without swapped pages */
          \t\t/* Both /proc/PID/smaps and /proc/PID/smaps_rollup are kept mathematically identical */
          \t\tif (unlikely(vma->vm_file && (vma->vm_flags & VM_EXEC) &&
          \t\t             priv->task && from_kuid(&init_user_ns, task_uid(priv->task)) >= 10000 &&
          \t\t             (mss->swap == vma_before_swap))) {
          \t\t\tunsigned long vma_dirty = mss->private_dirty - vma_before_dirty;
          \t\t\tunsigned long vma_anon = mss->anonymous - vma_before_anon;

          \t\t\tif (vma_dirty || vma_anon) {
          \t\t\t\tmss->private_clean += vma_dirty;
          \t\t\t\tmss->private_dirty -= vma_dirty;
          \t\t\t\tmss->anonymous -= vma_anon;
          \t\t\t}
          \t\t}
          \t}"""

          if target not in content:
              print("❌ Error: Target walk_page_vma line not found in fs/proc/task_mmu.c")
              exit(1)

          content = content.replace(target, replacement, 1)

          with open("fs/proc/task_mmu.c", "w") as f:
              f.write(content)

          print("✅ Successfully patched show_smap in fs/proc/task_mmu.c")
          PY_EOF
          git diff fs/proc/task_mmu.c

      - name: Patch Binder to Sanitize LineageOS Services for Untrusted Apps
        run: |
          cd kernel_src
          echo "=== Patching drivers/android/binder.c with aligned dual UTF-8/UTF-16 parser and diagnostic logs ==="
          python3 - << 'PY_EOF'
          with open("drivers/android/binder.c", "r") as f:
              content = f.read()

          marker = """\t\tbinder_user_error("%d:%d got transaction with invalid data ptr\\n",
          \t\t\t\tproc->pid, thread->pid);
          \t\treturn_error = BR_FAILED_REPLY;
          \t\treturn_error_param = -EFAULT;
          \t\treturn_error_line = __LINE__;
          \t\tgoto err_copy_data_failed;
          \t}"""

          injection = """\n
          \t/* Fast-path: Sanitize LineageOS service queries strictly for untrusted apps interacting with servicemanager */
          \tif (unlikely(tr->data_size >= 14 && context && context->binder_context_mgr_node &&
          \t             context->name && !strcmp(context->name, "binder"))) {
          \t\tbool is_target_txn = false;

          \t\tif (reply) {
          \t\t\t/* Inspect replies originating FROM servicemanager to untrusted apps for listServices (code 6 in Android AIDL, code 4 legacy) */
          \t\t\tif (proc == context->binder_context_mgr_node->proc && target_proc && target_proc->tsk &&
          \t\t\t    in_reply_to && (in_reply_to->code == 6 || in_reply_to->code == 4)) {
          \t\t\t\trcu_read_lock();
          \t\t\t\tif (from_kuid(&init_user_ns, task_uid(target_proc->tsk)) >= 10000) {
          \t\t\t\t\tchar c[TASK_COMM_LEN];
          \t\t\t\t\tget_task_comm(c, target_proc->tsk);
          \t\t\t\t\tc[TASK_COMM_LEN - 1] = '\\0';
          \t\t\t\t\tif (!strstr(c, "lineage") && !strstr(c, "android") && !strstr(c, "system") && !strstr(c, "trebuchet"))
          \t\t\t\t\t\tis_target_txn = true;
          \t\t\t\t}
          \t\t\t\trcu_read_unlock();
          \t\t\t}
          \t\t} else {
          \t\t\t/* Inspect requests directed TO servicemanager from untrusted apps for getService/checkService (codes 1, 2, and 4) */
          \t\t\tif (target_node == context->binder_context_mgr_node && proc && proc->tsk &&
          \t\t\t    (tr->code == 1 || tr->code == 2 || tr->code == 4)) {
          \t\t\t\trcu_read_lock();
          \t\t\t\tif (from_kuid(&init_user_ns, task_uid(proc->tsk)) >= 10000) {
          \t\t\t\t\tchar c[TASK_COMM_LEN];
          \t\t\t\t\tget_task_comm(c, proc->tsk);
          \t\t\t\t\tc[TASK_COMM_LEN - 1] = '\\0';
          \t\t\t\t\tif (!strstr(c, "lineage") && !strstr(c, "android") && !strstr(c, "system") && !strstr(c, "trebuchet"))
          \t\t\t\t\t\tis_target_txn = true;
          \t\t\t\t}
          \t\t\t\trcu_read_unlock();
          \t\t\t}
          \t\t}

          \t\tif (unlikely(is_target_txn)) {
          \t\t\t/* UTF-16 constants */
          \t\t\tstatic const u16 s_profile16[] = { 'p', 'r', 'o', 'f', 'i', 'l', 'e' };
          \t\t\tstatic const u16 s_lineage16[] = { 'l', 'i', 'n', 'e', 'a', 'g', 'e' };
          \t\t\tstatic const u16 s_vendor_lineage16[] = { 'v', 'e', 'n', 'd', 'o', 'r', '.', 'l', 'i', 'n', 'e', 'a', 'g', 'e' };
          \t\t\tstatic const u16 s_dummy16[] = { 'd', 'u', 'm', 'm', 'y', '_', '0' };

          \t\t\tif (!reply) {
          \t\t\t\t/* Sanitize getService/checkService requests */
          \t\t\t\tu32 req_buf[64]; /* 256 bytes, guaranteed 4-byte aligned */
          \t\t\t\tu8 *kdata = (u8 *)req_buf;
          \t\t\t\tsize_t copy_len = min_t(size_t, round_down(tr->data_size, 4), sizeof(req_buf));

          \t\t\t\tif (copy_len >= 40) {
          \t\t\t\t\tsize_t offset;
          \t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, req_buf, t->buffer, 0, copy_len);

          \t\t\t\t\tfor (offset = 0; offset + 12 <= copy_len; offset += 4) {
          \t\t\t\t\t\tint32_t len = *(int32_t *)(kdata + offset);
          \t\t\t\t\t\tif (len >= 7 && len <= 128) {
          \t\t\t\t\t\t\t/* Check UTF-16 */
          \t\t\t\t\t\t\tif (offset + 4 + (len * 2) <= copy_len) {
          \t\t\t\t\t\t\t\tu16 chars[128];
          \t\t\t\t\t\t\t\tsize_t u16_bytes = len * 2;
          \t\t\t\t\t\t\t\tif (u16_bytes <= sizeof(chars)) {
          \t\t\t\t\t\t\t\t\tmemcpy(chars, kdata + offset + 4, u16_bytes);
          \t\t\t\t\t\t\t\t\tif ((len == 7 && !memcmp(chars, s_profile16, 14)) ||
          \t\t\t\t\t\t\t\t\t    (len >= 7 && !memcmp(chars, s_lineage16, 14)) ||
          \t\t\t\t\t\t\t\t\t    (len >= 14 && !memcmp(chars, s_vendor_lineage16, 28))) {
          \t\t\t\t\t\t\t\t\t\tint32_t i;
          \t\t\t\t\t\t\t\t\t\tfor (i = 0; i < len; i++) {
          \t\t\t\t\t\t\t\t\t\t\tchars[i] = (i < 7) ? s_dummy16[i] : '0';
          \t\t\t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\t\tbinder_alloc_copy_to_buffer(&target_proc->alloc, t->buffer, offset + 4, chars, u16_bytes);
          \t\t\t\t\t\t\t\t\tbreak;
          \t\t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t/* Check UTF-8 */
          \t\t\t\t\t\t\tif (offset + 4 + len <= copy_len) {
          \t\t\t\t\t\t\t\tchar chars[128];
          \t\t\t\t\t\t\t\tif (len <= sizeof(chars)) {
          \t\t\t\t\t\t\t\t\tmemcpy(chars, kdata + offset + 4, len);
          \t\t\t\t\t\t\t\t\tif ((len == 7 && !memcmp(chars, "profile", 7)) ||
          \t\t\t\t\t\t\t\t\t    (len >= 7 && !memcmp(chars, "lineage", 7)) ||
          \t\t\t\t\t\t\t\t\t    (len >= 14 && !memcmp(chars, "vendor.lineage", 14))) {
          \t\t\t\t\t\t\t\t\tint32_t i;
          \t\t\t\t\t\t\t\t\tfor (i = 0; i < len; i++) {
          \t\t\t\t\t\t\t\t\t\tchars[i] = (i < 7) ? "dummy_0"[i] : \'0\';
          \t\t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\t\tbinder_alloc_copy_to_buffer(&target_proc->alloc, t->buffer, offset + 4, chars, len);
          \t\t\t\t\t\t\t\t\tbreak;
          \t\t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t} else {
          \t\t\t\t/* Sanitize listServices replies (32-bit aligned copies only) */
          \t\t\t\tif (tr->data_size >= 8) {
          \t\t\t\t\tint32_t header[2];
          \t\t\t\t\tint32_t exc, count;

          \t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, header, t->buffer, 0, sizeof(header));
          \t\t\t\texc = header[0];
          \t\t\t\tcount = header[1];

          \t\t\t\tif (exc == 0 && count > 0 && count <= 2000) {
          \t\t\t\t\tsize_t offset = 8;
          \t\t\t\t\tint32_t c_idx;

          \t\t\t\t\tfor (c_idx = 0; c_idx < count && offset + 4 <= tr->data_size; c_idx++) {
          \t\t\t\t\t\tint32_t len = 0;
          \t\t\t\t\t\tsize_t str_bytes;
          \t\t\t\t\t\tbool is_utf16 = false;
          \t\t\t\t\t\tu32 first_word = 0;

          \t\t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, &len, t->buffer, offset, sizeof(len));

          \t\t\t\t\t\tif (len < 0 || len > 256) {
          \t\t\t\t\t\t\tif (len < 0) offset += 4;
          \t\t\t\t\t\t\telse break;
          \t\t\t\t\t\t\tcontinue;
          \t\t\t\t\t\t}

          \t\t\t\t\t\tif (offset + 4 + 4 <= tr->data_size) {
          \t\t\t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, &first_word, t->buffer, offset + 4, sizeof(first_word));
          \t\t\t\t\t\t\tif (((u8 *)&first_word)[1] == 0)
          \t\t\t\t\t\t\t\tis_utf16 = true;
          \t\t\t\t\t\t}

          \t\t\t\t\t\tif (is_utf16) {
          \t\t\t\t\t\t\tstr_bytes = ((len + 1) * 2 + 3) & ~3;
          \t\t\t\t\t\t\tif (offset + 4 + str_bytes > tr->data_size) break;

          \t\t\t\t\t\t\tif (len >= 7 && len <= 128 && str_bytes <= 256) {
          \t\t\t\t\t\t\t\tu16 chars[128];
          \t\t\t\t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, chars, t->buffer, offset + 4, str_bytes);

          \t\t\t\t\t\t\t\tif ((len == 7 && !memcmp(chars, s_profile16, 14)) ||
          \t\t\t\t\t\t\t\t    (len >= 7 && !memcmp(chars, s_lineage16, 14)) ||
          \t\t\t\t\t\t\t\t    (len >= 14 && !memcmp(chars, s_vendor_lineage16, 28))) {
          \t\t\t\t\t\t\t\t\tint32_t i;
          \t\t\t\t\t\t\t\t\tfor (i = 0; i < len; i++) {
          \t\t\t\t\t\t\t\t\t\tchars[i] = (i < 7) ? s_dummy16[i] : '0';
          \t\t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\t\tbinder_alloc_copy_to_buffer(&target_proc->alloc, t->buffer, offset + 4, chars, str_bytes);
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t} else {
          \t\t\t\t\t\t\t/* UTF-8 string processing (Android 14-16) */
          \t\t\t\t\t\t\tstr_bytes = (len + 1 + 3) & ~3;
          \t\t\t\t\t\t\tif (offset + 4 + str_bytes > tr->data_size) break;

          \t\t\t\t\t\t\tif (len >= 7 && len <= 128 && str_bytes <= 128) {
          \t\t\t\t\t\t\t\tchar chars[128];
          \t\t\t\t\t\t\t\tbinder_alloc_copy_from_buffer(&target_proc->alloc, chars, t->buffer, offset + 4, str_bytes);

          \t\t\t\t\t\t\t\tif ((len == 7 && !memcmp(chars, "profile", 7)) ||
          \t\t\t\t\t\t\t\t    (len >= 7 && !memcmp(chars, "lineage", 7)) ||
          \t\t\t\t\t\t\t\t    (len >= 14 && !memcmp(chars, "vendor.lineage", 14))) {
          \t\t\t\t\t\t\t\t\tint32_t i;
          \t\t\t\t\t\t\t\t\tfor (i = 0; i < len; i++) {
          \t\t\t\t\t\t\t\t\t\tchars[i] = (i < 7) ? "dummy_0"[i] : \'0\';
          \t\t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t\t\tbinder_alloc_copy_to_buffer(&target_proc->alloc, t->buffer, offset + 4, chars, str_bytes);
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t}
          \t\t\t\t\t\toffset += 4 + str_bytes;
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t}"""

          if marker not in content:
              print("❌ Error: Target marker block not found in drivers/android/binder.c")
              exit(1)

          content = content.replace(marker, marker + injection, 1)

          with open("drivers/android/binder.c", "w") as f:
              f.write(content)

          print("✅ Successfully patched drivers/android/binder.c with aligned dual UTF-8/UTF-16 parser and diagnostic logs")
          PY_EOF
          git diff drivers/android/binder.c

      - name: Setup ReSukiSU Driver
        run: |
          cd kernel_src
          echo "=== Adding ReSukiSU (Main Branch for v4.2.0-rc1) ==="
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git
          
          # Symlink the kernel driver
          cd drivers
          ln -sf ../ReSukiSU/kernel kernelsu
          cd ..
          
          # Register in Makefile and Kconfig
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig

      - name: Apply SuSFS Inline Hooks
        run: |
          cd kernel_src
          echo "=== Applying SuSFS inline hooks ==="
          # Must run after drivers/kernelsu is symlinked so ksu_handle_setresuid is hooked
          bash ../nongki_build/Patches/susfs_inline_hook_patches.sh
          echo "✅ SuSFS inline hooks applied."

      - name: Bypass Vendor Module CRC Check (Fix Vendor Module Loading)
        run: |
          cd kernel_src
          echo "=== Allowing vendor modules to load despite compiler CRC difference ==="
          sed -i '/bad_version:/,/return 0;/s/return 0;/return 1;/' kernel/module.c

      - name: Fix Driver Include Paths
        run: |
          cd kernel_src
          echo "=== Fixing driver include syntax for standalone Clang compilation ==="
          # 1. Camera Floral Tracepoint Path
          sed -i "1i ccflags-y += -I\$(src)" drivers/media/platform/msm/camera_floral/cam_utils/Makefile

          # 2. Battery driver angled includes -> quoted includes
          sed -i 's/<google\/google_bms.h>/"google\/google_bms.h"/' drivers/power/supply/max1720x_battery.c
          sed -i 's/<google\/logbuffer.h>/"google\/logbuffer.h"/' drivers/power/supply/max1720x_battery.c

          # 3. IPA v3 driver missing parent include directory
          sed -i "1i ccflags-y += -I\$(srctree)/drivers/platform/msm/ipa/ipa_v3" drivers/platform/msm/ipa/ipa_v3/Makefile

          # 4. Fix relative angled includes (<../...>) across all drivers safely
          grep -rlE '#include <\.\./' drivers/ | xargs -r sed -i -E 's|#include <(\.\./[^>]+)>|#include "\1"|g'

      - name: Configure ReSukiSU + SuSFS Kernel
        run: |
          cd kernel_src
          echo "=== Generating base .config from floral_defconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            floral_defconfig

          echo "=== Setting ReSukiSU + SuSFS kernel options via scripts/config ==="
          # SuSFS configuration
          ./scripts/config --file .config \
            -e KSU \
            -d KSU_WITH_KPROBES \
            -d KSU_MANUAL_HOOK \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_MAP \
            -d CC_WERROR \
            -e OVERLAY_FS \
            -e TMPFS_XATTR \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -d BUILD_ARM64_APPENDED_DTB_IMAGE \
            -d BUILD_ARM64_DT_OVERLAY

          # Enforce exact stock vermagic
          echo "${{ env.STOCK_RELEASE }}" > .scmversion
          mkdir -p include/config
          echo "${{ env.STOCK_RELEASE }}" > include/config/kernel.release

          echo "=== Updating and verifying .config with olddefconfig ==="
          make -j"$(nproc)" ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            olddefconfig

          echo "=== Verifying SuSFS config in final .config ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_TMPFS_XATTR" .config

      - name: Build ReSukiSU + SuSFS Kernel Binary (Image.lz4)
        run: |
          cd kernel_src
          echo "=== Compiling ReSukiSU + SuSFS Image.lz4 with pure LLVM ==="
          make -j"$(nproc)" ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            KERNELRELEASE="${{ env.STOCK_RELEASE }}" \
            Image.lz4

          echo "=== Verifying KernelSU and SuSFS strings in compiled vmlinux ==="
          if strings vmlinux | grep -i -q "kernelsu"; then
            echo "✅ ReSukiSU symbols/strings found in vmlinux!"
          else
            echo "❌ ERROR: No KernelSU strings found in the compiled binary!"
            exit 1
          fi

          if strings vmlinux | grep -i -q "susfs"; then
            echo "✅ SuSFS symbols/strings found in vmlinux!"
          else
            echo "❌ ERROR: No SuSFS strings found in the compiled binary!"
            exit 1
          fi

      - name: Repack ReSukiSU + SuSFS boot.img
        run: |
          set -e
          
          IMAGE_LZ4=$(find kernel_src/arch/arm64/boot -name "Image.lz4" | head -n 1)
          test -f "$IMAGE_LZ4" || { echo "::error::Image.lz4 not found!"; exit 1; }
          cp "$IMAGE_LZ4" out_artifacts/Image.lz4

          echo "=== Substituting newly compiled kernel ==="
          ARGS=$(cat mkbootimg_args)
          NEW_ARGS=$(echo "$ARGS" | sed -E "s#--kernel [^ ]+#--kernel out_artifacts/Image.lz4#")

          echo "=== Repacking boot.img ==="
          eval "python3 mkbootimg_tools/mkbootimg.py $NEW_ARGS --output out_artifacts/boot.img"

          test -f out_artifacts/boot.img || { echo "::error::Failed to create repacked boot.img"; exit 1; }
          echo "Successfully created ReSukiSU + SuSFS boot.img"

      - name: Upload ReSukiSU + SuSFS boot.img Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coral-resukisu-susfs
          path: out_artifacts/*
          if-no-files-found: error
